[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "book-agent"
version = "0.1.0"
description = "LangGraph pipeline for draft-to-PDF book generation"
requires-python = ">=3.11"
authors = [
    { name = "Felipe Carvajal Brown" },
]
dependencies = [
    "langgraph>=1.1.9",
    "langchain-core>=1.3.1",
    "cairosvg>=2.7.0",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.2.0"]
